[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omnivoice-dpo"
version = "0.0.1"
description = "Preference optimization (iterative DPO on ELBO scores, later GRPO) for OmniVoice masked-diffusion TTS"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
keywords = ["tts", "text-to-speech", "dpo", "preference-optimization", "masked-diffusion", "omnivoice"]
dependencies = [
    # Pinned: the sampler and ELBO scorer reuse OmniVoice internals (_preprocess_all, _prepare_inference_inputs).
    "omnivoice[lora] @ git+https://github.com/k2-fsa/OmniVoice@08be0b4",
    "torch>=2.4",
    "accelerate",
    "pyyaml",
    "soundfile",
    "numpy",
]

[project.optional-dependencies]
rewards = [
    "faster-whisper",
    "jiwer",
]
dev = ["pytest"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["omnivoice_dpo"]
